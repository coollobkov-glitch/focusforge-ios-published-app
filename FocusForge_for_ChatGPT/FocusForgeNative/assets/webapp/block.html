 is the person you were yesterday.","Invest in yourself. It pays the best interest.","Your life does not get better by chance. It gets better by change.","Be the change you want to see in the world.","The mind is everything. What you think you become.","You are the average of the five people you spend the most time with.","Work hard in silence. Let success make the noise.","The expert in anything was once a beginner.","Don't limit your challenges. Challenge your limits.","If you want to fly, give up everything that weighs you down.","Act as if what you do makes a difference. It does.","Everything you've ever wanted is on the other side of fear.","Be yourself; everyone else is already taken.","You are enough. You have enough. You do enough.","Believe you can and you're halfway there.","It always seems impossible until it is done.","The future belongs to those who believe in the beauty of their dreams.","Life is what happens when you're busy making other plans.","In the middle of every difficulty lies opportunity.","The only way to do great work is to love what you do.","It is never too late to be what you might have been.","You miss 100% of the shots you don't take.","Whether you think you can or think you can't, you're right.","Perfection is the enemy of progress.","The man who moves a mountain begins by carrying away small stones.","Your time is limited, so don't waste it living someone else's life.","The two most important days in your life are the day you are born and the day you find out why.","You only live once, but if you do it right, once is enough.","Life is not measured by the number of breaths we take, but by the moments that take our breath away.","Be the hero of your own story.","Hard work beats talent when talent doesn't work hard.","There are no shortcuts to any place worth going.","The difference between ordinary and extraordinary is that little extra.","Fall seven times, stand up eight.","Strength doesn't come from what you can do. It comes from overcoming what you couldn't.","Nothing worth having comes easy.","If it were easy, everyone would do it.","The road to success is dotted with many tempting parking spaces.","Success usually comes to those who are too busy to be looking for it.","Opportunities don't happen. You create them.","I find that the harder I work, the more luck I seem to have.","Success is not final; failure is not fatal. It is the courage to continue that counts.","The only place where success comes before work is in the dictionary.","Don't watch the clock. Do what it does. Keep going.","Keep going. Everything you need will come to you at the perfect time.","You don't get what you wish for. You get what you work for.","Rome wasn't built in a day, but they were laying bricks every hour.","A river cuts through rock not because of its power but because of its persistence.","The secret to getting ahead is getting started.","I am not a product of my circumstances. I am a product of my decisions.","Hardships often prepare ordinary people for an extraordinary destiny.","Courage is not the absence of fear, but rather the judgment that something else is more important.","It's not whether you get knocked down, it's whether you get up.","Many of life's failures are people who did not realize how close they were to success when they gave up.","The difference between a stumbling block and a stepping stone is how high you raise your foot.","Success is stumbling from failure to failure with no loss of enthusiasm.","Genius is 1% inspiration and 99% perspiration.","The three great essentials to achieve anything worthwhile are: hard work, stick-to-itiveness, and common sense.","There are no traffic jams along the extra mile.","The only limit to our realization of tomorrow will be our doubts of today.","Time you enjoy wasting is not wasted time.","Lost time is never found again.","The key is not to prioritize what's on your schedule, but to schedule your priorities.","You can't go back and change the beginning, but you can start where you are and change the ending.","Either you run the day or the day runs you.","Time is a created thing. To say 'I don't have time' is to say 'I don't want to.'","The bad news is time flies. The good news is you're the pilot.","Don't count the days, make the days count.","Time is the most valuable thing a man can spend.","Ordinary people think merely of spending time. Great people think of using it.","The way we spend our time defines who we are.","Until we can manage time, we can manage nothing else.","Time flies over us but leaves its shadow behind.","You may delay, but time will not.","Don't be fooled by the calendar. There are only as many days in the year as you make use of.","A year from now you may wish you had started today.","The trouble is, you think you have time.","Yesterday is gone. Tomorrow has not yet come. We have only today. Let us begin.","How you spend your mornings determines how you live your life.","Someday is not a day of the week.","The present moment is the only moment available to us, and it is the door to all moments.","Do not wait. The time will never be just right.","Stop managing your time. Start managing your energy.","You have exactly the same number of hours per day that were given to Helen Keller, Michelangelo, Mother Teresa, Leonardo da Vinci, and Albert Einstein.","Your calendar is a mirror of your values.","What gets scheduled gets done.","The most successful people I know aren't driven by money, by fame, or even by passion. They're driven by meaning.","Focus on being productive instead of busy.","If you spend too much time thinking about a thing, you'll never get it done.","Energy, not time, is the fundamental currency of high performance.","Your mind is a powerful thing. When you fill it with positive thoughts, your life will start to change.","The greatest weapon against stress is our ability to choose one thought over another.","You have power over your mind, not outside events. Realize this and you will find strength.","It's not what happens to you, but how you react to it that matters.","The mind is not a vessel to be filled but a fire to be kindled.","Once your mindset changes, everything on the outside will change along with it.","The happiness of your life depends upon the quality of your thoughts.","Whatever the mind can conceive and believe, it can achieve.","You become what you think about all day long.","You are today where your thoughts have brought you. You will be tomorrow where your thoughts take you.","The only limits you have are the limits you believe.","A man is but the product of his thoughts. What he thinks, he becomes.","Change your thoughts and you change your world.","Whether you're winning or losing, it's important to always bring your best self to the table.","Your thoughts are the architects of your destiny.","The mind is everything. What you think you become.","Train your mind to see the good in every situation.","What you think, you become. What you feel, you attract. What you imagine, you create.","Believe in yourself and all that you are. Know that there is something inside you that is greater than any obstacle.","You are braver than you believe, stronger than you seem, and smarter than you think.","The strongest factor for success is self-esteem: believing you can do it, believing you deserve it, believing you will get it.","If you realized how powerful your thoughts are, you would never think a negative thought.","The mind is like water. When it's turbulent, it's difficult to see. When it's calm, everything becomes clear.","It's not the load that breaks you down. It's the way you carry it.","You can't control everything. Sometimes you just need to relax and have faith that things will work out.","The goal is not to be perfect by the end. The goal is to be better today.","Don't be pushed around by the fears in your mind. Be led by the dreams in your heart.","You have been assigned this mountain to show others it can be moved.","The struggle you're in today is developing the strength you need for tomorrow.","Growth is painful. Change is painful. But nothing is as painful as staying stuck somewhere you don't belong.","Success is not the key to happiness. Happiness is the key to success.","The secret of success is to do the common thing uncommonly well.","Success is liking yourself, liking what you do, and liking how you do it.","Define success on your own terms, achieve it by your own rules, and build a life you're proud to live.","Success is walking from failure to failure with no loss of enthusiasm.","The starting point of all achievement is desire.","All our dreams can come true, if we have the courage to pursue them.","Success seems to be connected with action. Successful people keep moving.","The difference between a successful person and others is not a lack of strength, not a lack of knowledge, but rather a lack in will.","Success is not overnight. It's when every day you get a little better than the day before.","Success is going from failure to failure without losing your enthusiasm.","Your success is found in your daily routine.","Success is a few simple disciplines practiced every day, while failure is simply a few errors in judgment repeated every day.","The path to success is to take massive, determined action.","Don't aim for success if you want it; just do what you love and believe in, and it will come naturally.","Success is not measured by what you accomplish, but by the opposition you have encountered, and the courage with which you have maintained the struggle against overwhelming odds.","I never dreamed about success. I worked for it.","The secret of joy in work is contained in one word: excellence.","A successful man is one who can lay a firm foundation with the bricks others have thrown at him.","Behind every successful person lies a pack of haters.","Don't be distracted by criticism. Remember, the only taste of success some people have is when they take a bite out of you.","Successful people do what unsuccessful people are not willing to do.","Success is no accident. It is hard work, perseverance, learning, studying, sacrifice and most of all, love of what you are doing.","Success is the sum of small efforts repeated day in and day out.","To succeed in life, you need two things: ignorance and confidence.","If you want to achieve greatness, stop asking for permission.","Things work out best for those who make the best of how things work out.","To live a creative life, we must lose our fear of being wrong.","If you are not willing to risk the usual, you will have to settle for the ordinary.","Trust because you are willing to accept the risk, not because it's safe or certain.","The secret to getting ahead is getting started.","Action is the foundational key to all success.","You don't have to be fearless. Just don't let fear stop you.","Inaction breeds doubt and fear. Action breeds confidence and courage.","The most effective way to do it is to do it.","You don't need more time. You need to decide.","Don't wait for everything to be perfect before you decide to enjoy your life.","Take the first step in faith. You don't have to see the whole staircase, just take the first step.","The journey of a thousand miles begins with one step.","A year from now you may wish you had started today.","Procrastination is the art of keeping up with yesterday.","You don't have to be great to start, but you have to start to be great.","The best way to predict the future is to create it.","You are one decision away from a completely different life.","It always seems impossible until it is done.","Don't think. Thinking is the enemy of creativity.","The way to get started is to quit talking and begin doing.","Waiting is a trap. There will always be reasons to wait. The truth is, there are only two things in life: reasons and results, and reasons simply don't count.","The best revenge is massive success.","Don't be afraid to give up the good to go for the great.","I am not afraid of storms, for I am learning how to sail my ship.","Life is inherently risky. There is only one big risk you should avoid at all costs, and that is the risk of doing nothing.","In any moment of decision, the best thing you can do is the right thing, the next best thing is the wrong thing, and the worst thing you can do is nothing.","Do one thing every day that scares you.","Opportunity dances with those already on the dance floor.","We cannot solve problems with the kind of thinking we employed when we came up with them.","Learn as if you will live forever, live like you will die tomorrow.","Stay away from those people who try to disparage your ambitions.","When you give joy to other people, you get more joy in return.","You have to be odd to be number one.","You'll never change your life until you change something you do daily.","Motivation is what gets you started. Habit is what keeps you going.","First forget inspiration. Habit is more dependable. Habit will sustain you whether you're inspired or not.","The chains of habit are too light to be felt until they are too heavy to be broken.","Good habits are worth being fanatical about.","Your net worth to the world is usually determined by what remains after your bad habits are subtracted from your good ones.","Habits are first cobwebs, then cables.","The secret of your future is hidden in your daily routine.","Successful people are simply those with successful habits.","In essence, if we want to direct our lives, we must take control of our consistent actions.","An ounce of practice is worth more than tons of preaching.","We first make our habits, and then our habits make us.","You leave old habits behind by starting out with the thought, 'I release the need for this in my life'.","Winners make a habit of manufacturing their own positive expectations in advance of the event.","The secret of getting ahead is getting started. The secret of getting started is breaking your complex, overwhelming tasks into small manageable tasks, and then starting on the first one.","A habit cannot be tossed out the window; it must be coaxed down the stairs a step at a time.","Make it a rule of life never to regret and never to look back. Regret is an appalling waste of energy.","Good habits formed at youth make all the difference.","If you want to go fast, go alone. If you want to go far, go together.","Sow a thought, reap an action; sow an action, reap a habit; sow a habit, reap a character; sow a character, reap a destiny.","The will to win, the desire to succeed, the urge to reach your full potential… these are the keys that will unlock the door to personal excellence.","Excellence is not a singular act, but a habit. You are what you repeatedly do.","Lose an hour in the morning, and you will spend all day looking for it.","A healthy outside starts from the inside.","Take care of your body. It's the only place you have to live.","Your body is your most priceless possession. Take care of it.","The groundwork for all happiness is good health.","Early to bed and early to rise makes a man healthy, wealthy, and wise.","A good laugh and a long sleep are the two best cures for anything.","The secret of a healthy life is not to mourn for the past, worry about the future, or anticipate troubles, but to live in the present moment wisely and earnestly.","The two most important days in your life are the day you are born and the day you find out why.","He who has a why to live can bear almost any how.","The purpose of life is to live it, to taste experience to the utmost, to reach out eagerly and without fear for newer and richer experience.","Life is not a problem to be solved, but a reality to be experienced.","The meaning of life is to find your gift. The purpose of life is to give it away.","Don't ask what the world needs. Ask what makes you come alive, and go do it. Because what the world needs is people who have come alive.","Your purpose in life is to find your purpose and give your whole heart and soul to it.","The man without a purpose is like a ship without a rudder.","If you can't figure out your purpose, figure out your passion. For your passion will lead you right into your purpose.","Great minds have purposes; others have wishes.","The secret of man's being is not only to live but to have something to live for.","Efforts and courage are not enough without purpose and direction.","Where there is no vision, there is no hope.","A life spent making mistakes is not only more honorable, but more useful than a life spent doing nothing.","Only a life lived for others is a life worthwhile.","The purpose of our lives is to be happy.","Life is either a daring adventure or nothing at all.","To the well-organized mind, death is but the next great adventure.","Life is not measured by the number of breaths we take, but by the moments that take our breath away.","Begin at once to live, and count each separate day as a separate life.","Your life is your message to the world. Make sure it's inspiring.","The most important thing is to enjoy your life — to be happy — it's all that matters.","Live the life you have imagined.","Go confidently in the direction of your dreams. Live the life you have imagined.","The biggest adventure you can take is to live the life of your dreams.","Life is what happens when you're busy making other plans.","In the end, it's not the years in your life that count. It's the life in your years.","Twenty years from now you will be more disappointed by the things that you didn't do than by the ones you did do.","You only live once, but if you do it right, once is enough.","The good life is one inspired by love and guided by knowledge.","A leader is one who knows the way, goes the way, and shows the way.","Leadership is not about being in charge. It is about taking care of those in your charge.","The greatest leader is not necessarily the one who does the greatest things. He is the one that gets the people to do the greatest things.","Before you are a leader, success is all about growing yourself. When you become a leader, success is all about growing others.","Management is doing things right. Leadership is doing the right things.","A man who wants to lead the orchestra must turn his back on the crowd.","You don't need a title to be a leader.","The art of leadership is saying no, not saying yes.","Leadership is the capacity to translate vision into reality.","Example is not the main thing in influencing others. It is the only thing.","People buy into the leader before they buy into the vision.","Outstanding leaders go out of their way to boost the self-esteem of their personnel.","The key to successful leadership is influence, not authority.","It is better to lead from behind and to put others in front, especially when you celebrate victory.","A good leader takes a little more than his share of the blame, a little less than his share of the credit.","You have power over your mind, not outside events. Realize this and you will find strength.","Waste no more time arguing what a good man should be. Be one.","Very little is needed to make a happy life; it is all within yourself, in your way of thinking.","The happiness of those who want to be popular depends on others. The happiness of those who seek pleasure fluctuates with moods outside their control. But the happiness of the wise grows out of their own free acts.","If it is not right do not do it; if it is not true do not say it.","Confine yourself to the present.","Never let the future disturb you. You will meet it, if you have to, with the same weapons of reason which today arm you against the present.","He suffers more than necessary, who suffers before it is necessary.","Make the best use of what is in your power, and take the rest as it happens.","Seek not the good in external things. Seek it in yourself.","First say to yourself what you would be; then do what you have to do.","He who is brave is free.","No man is free who is not master of himself.","Luck is what happens when preparation meets opportunity.","It's not that I'm so smart, it's just that I stay with problems longer.","Imagination is more important than knowledge.","Logic will get you from A to Z; imagination will get you everywhere.","Life is like riding a bicycle. To keep your balance, you must keep moving.","Insanity is doing the same thing over and over again and expecting different results.","There are only two ways to live your life. One is as though nothing is a miracle. The other is as though everything is a miracle.","The only way to do great work is to love what you do.","Innovation distinguishes between a leader and a follower.","Your work is going to fill a large part of your life, and the only way to be truly satisfied is to do what you believe is great work.","Stay hungry, stay foolish.","Design is not just what it looks like and feels like. Design is how it works.","I'm convinced that about half of what separates successful entrepreneurs from the non-successful ones is pure perseverance.","I have not failed. I've just found 10,000 ways that won't work.","Our greatest weakness lies in giving up. The most certain way to succeed is always to try just one more time.","There's a way to do it better — find it.","Everything should be made as simple as possible, but not simpler.","The measure of intelligence is the ability to change.","If you don't build your dream, someone else will hire you to help them build theirs.","The richest people in the world look for and build networks. Everyone else looks for work.","Stop doubting yourself. Work hard, and make it happen.","Build your own dreams, or someone else will hire you to build theirs.","The biggest risk is not taking any risk.","Move fast and break things.","Done is better than perfect.","The best marketing strategy ever: CARE.","If you really look closely, most overnight successes took a long time.","You were given this life because you are strong enough to live it.","Rock bottom will teach you lessons that mountain tops never will.","The comeback is always stronger than the setback.","When you feel like quitting, think about why you started.","Pain is temporary. Quitting lasts forever.","I am not what happened to me. I am what I choose to become.","Even the darkest night will end and the sun will rise.","You were born to win, but to be a winner, you must plan to win, prepare to win, and expect to win.","Stars can't shine without darkness.","The strongest people are not those who show strength in front of us but those who win battles we know nothing about.","Every adversity, every failure, every heartbreak, carries with it the seed of an equal or greater benefit.","Out of difficulties grow miracles.","You may have to fight a battle more than once to win it.","Turn your wounds into wisdom.","What lies behind us and what lies before us are tiny matters compared to what lies within us.","Accept the challenges so that you can feel the exhilaration of victory.","I can be changed by what happens to me. But I refuse to be reduced by it.","Life is not about how fast you run or how high you climb, but how well you bounce.","Character cannot be developed in ease and quiet. Only through experience of trial and suffering can the soul be strengthened, ambition inspired, and success achieved.","Circumstances do not make the man, they reveal him.","You have within you right now, everything you need to deal with whatever the world can throw at you.","The human capacity for burden is like bamboo — far more flexible than you'd ever believe at first glance.","Do not judge me by my success, judge me by how many times I fell down and got back up again.","My barn having burned down, I can now see the moon.","Smooth seas do not make skillful sailors.","A smooth sea never made a skilled sailor.","It is only in our darkest hours that we may discover the true strength of the brilliant light within ourselves that can never, ever be dimmed.","The oak fought the wind and was broken, the willow bent when it must and survived.","Sometimes you don't realize your own strength until you come face to face with your greatest weakness.","There is no education like adversity.","Be thankful for what you have; you'll end up having more.","Gratitude makes sense of our past, brings peace for today, and creates a vision for tomorrow.","In ordinary life, we hardly realize we receive a great deal more than we give, and that it is only with gratitude that life becomes rich.","Silent gratitude isn't very much use to anyone.","Enjoy the little things, for one day you may look back and realize they were the big things.","The present moment is the only moment available to us.","Forever is composed of nows.","Yesterday is history, tomorrow is a mystery, today is a gift of God, which is why we call it the present.","Life is available only in the present moment.","I have arrived. I am home. In the here. In the now.","Wherever you are, be all there.","You can't start the next chapter of your life if you keep re-reading the last one.","Happiness is not something you postpone for the future; it is something you design for the present.","Don't wait for the perfect moment, take the moment and make it perfect.","The secret of health for both mind and body is not to mourn for the past, not to worry about the future, but to live the present moment wisely and earnestly.","With the new day comes new strength and new thoughts.","Count your age by friends, not years. Count your life by smiles, not tears.","When I was 5 years old, my mother always told me that happiness was the key to life.","The most wasted of days is one without laughter.","You can't be sad in the presence of a big scoop of ice cream.","We tend to forget that happiness doesn't come as a result of getting something we don't have, but rather of recognizing and appreciating what we do have.","The world is full of magical things patiently waiting for our wits to grow sharper.","Happiness is when what you think, what you say, and what you do are in harmony.","For every minute you are angry you lose sixty seconds of happiness.","Thousands of candles can be lighted from a single candle, and the life of the candle will not be shortened.","The most beautiful thing we can experience is the mysterious. It is the source of all true art and science.","Spread love everywhere you go. Let no one ever come to you without leaving happier.","When you arise in the morning, think of what a precious privilege it is to be alive — to breathe, to think, to enjoy, to love.","It is not happiness that makes us grateful. It is gratefulness that makes us happy.","Do not go where the path may lead, go instead where there is no path and leave a trail.","The secret to wealth is simple: Find a way to do more for others than anyone else does.","Formal education will make you a living; self-education will make you a fortune.","Rich people have small TVs and big libraries, and poor people have small libraries and big TVs.","An investment in knowledge pays the best interest.","Wealth is the ability to fully experience life.","If you want to be rich, simply serve more people.","Wealth is not about having a lot of money; it's about having a lot of options.","Not he who has much is rich, but he who gives much.","Wealth consists not in having great possessions, but in having few wants.","The real measure of your wealth is how much you'd be worth if you lost all your money.","Work like you don't need the money. Love like you've never been hurt. Dance like nobody's watching.","Money is usually attracted, not pursued.","The goal isn't more money. The goal is living life on your own terms.","If your only goal is to become rich, you will never achieve it.","Too many people spend money they haven't earned to buy things they don't want to impress people they don't like.","Financial freedom is available to those who learn about it and work for it.","The stock market is a device for transferring money from the impatient to the patient.","Do not save what is left after spending, but spend what is left after saving.","A budget is telling your money where to go instead of wondering where it went.","The habit of saving is itself an education; it fosters every virtue, teaches self-denial, cultivates the sense of order, trains to forethought, and so broadens the mind.","Tell me and I forget, teach me and I may remember, involve me and I learn.","Education is the most powerful weapon which you can use to change the world.","The more that you read, the more things you will know.","Live as if you were to die tomorrow. Learn as if you were to live forever.","The beautiful thing about learning is that no one can take it away from you.","Education is not the filling of a pail, but the lighting of a fire.","I am always doing that which I cannot do, in order that I may learn how to do it.","The art of teaching is the art of assisting discovery.","If you think education is expensive, try ignorance.","It is impossible for a man to learn what he thinks he already knows.","The more I read, the more I acquire, the more certain I am that I know nothing.","Real learning comes about when the competitive spirit has ceased.","Education is not preparation for life; education is life itself.","The highest activity a human being can attain is learning for understanding, because to understand is to be free.","The only true wisdom is in knowing you know nothing.","One of the greatest diseases is to be nobody to anybody.","Change is the end result of all true learning.","Develop a passion for learning. If you do, you will never cease to grow.","The mind is not a vessel to be filled but a fire to be kindled.","Anyone who stops learning is old, whether at twenty or eighty.","The purpose of learning is growth, and our minds, unlike our bodies, can continue growing as long as we live.","Reading is to the mind what exercise is to the body.","A reader lives a thousand lives before he dies. The man who never reads lives only one.","Not all those who wander are lost.","Books are a uniquely portable magic.","Until I feared I would lose it, I never loved to read. One does not love breathing.","There is no friend as loyal as a book.","Outside of a dog, a book is man's best friend. Inside of a dog it's too dark to read.","I find television very educating. Every time somebody turns on the set, I go into the other room and read a book.","Think before you speak. Read before you think.","Concentrate all your thoughts upon the work at hand. The sun's rays do not burn until brought to a focus.","That's been one of my mantras — focus and simplicity. Simple can be harder than complex.","Always remember, your focus determines your reality.","Energy flows where attention goes.","Where focus goes, energy flows.","The key to success is to focus our conscious mind on things we desire, not things we fear.","Focusing is about saying no.","You can do anything, but not everything.","If you chase two rabbits, you will catch neither one.","The man who chases two rabbits catches neither.","Half of the troubles of this life can be traced to saying yes too quickly and not saying no soon enough.","Simplicity is the ultimate sophistication.","It is not enough to be busy. So are the ants. The question is: What are we busy about?","Do fewer things, do them better.","The ability to simplify means to eliminate the unnecessary so that the necessary may speak.","Eliminate the unnecessary so the necessary may speak.","You can't do everything at once, but you can do something at once.","People think focus means saying yes to the thing you've got to focus on. But that's not what it means at all. It means saying no to the hundred other good ideas that there are.","Lack of direction, not lack of time, is the problem. We all have twenty-four hour days.","You will never feel truly satisfied by work until you are satisfied by life.","Think of many things; do one.","Do what you can, with what you have, where you are.","Nothing is particularly hard if you divide it into small jobs.","You don't need to see the whole staircase, just take the first step.","A small daily task, if it be really daily, will beat the labours of a spasmodic Hercules.","Eat the frog first.","The secret of getting things done is to act.","Procrastination is opportunity's assassin.","Procrastination makes easy things hard, hard things harder.","You don't have to be great to get started, but you have to get started to be great.","Do it. Don't talk about it.","Less talk. More work.","Earn it.","No excuses.","Stay focused. Stay disciplined.","Be relentless.","Make it happen.","Show up. Every. Single. Day.","Outwork everyone.","Be the hardest worker in the room.","Silence the doubt with action.","Progress over perfection.","1% better every day.","Locked in.","Zero distractions.","Prove them wrong.","Protect your focus.","Your goals don't care about your feelings.","Be obsessed or be average.","Get comfortable being uncomfortable.","Win the morning, win the day.","Earn your rest.","No days off from your dreams.","The work is the reward.","Do the work when no one is watching.","Be so good they can't ignore you.","Results, not excuses.","All in. No half measures.","Champions train. Losers complain.","Your only competition is who you were yesterday.","Hard times build strong people.","Pressure makes diamonds.","Burn the boats.","Trust the process.","Stay the course.","Today is the day.","Now or never.","Do it scared.","Start before you're ready.","Decide. Commit. Succeed.","Don't wish for it. Work for it.","Be hungry. Stay humble.","Run your own race.","Eyes on the prize.","Never settle.","Rise and grind.","Hustle in silence.","Let your work speak.","Evolve or repeat.","Grow through what you go through.","What would you do if you weren't afraid?","In 10 years, you'll regret the things you didn't do more than the things you did.","Are you building the life you want, or just surviving the life you have?",
