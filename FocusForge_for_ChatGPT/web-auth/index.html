<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FocusForge Account</title></head>
<body><main><a class="brand" href="/">FOCUSFORGE</a><section class="card"><p class="kicker">YOUR ACCOUNT</p><h1 id="title">Checking your email link</h1><p id="description" role="status" aria-live="polite">Please wait a moment.</p><p id="error" role="alert" hidden></p>
<form id="password-form" hidden novalidate><label for="password">New password</label><input id="password" type="password" autocomplete="new-password" aria-describedby="requirements"><p id="requirements" class="hint">Use at least 6 characters. A longer, unique password is recommended.</p><label for="confirmation">Confirm new password</label><input id="confirmation" type="password" autocomplete="new-password"><button type="submit" id="save">Save new password</button></form>
<form id="request-form" hidden novalidate><label for="email">Email address</label><input id="email" type="email" autocomplete="email"><button id="request" type="submit">Send a new reset link</button></form>
<div id="done" hidden><a class="button" href="focusforge://">Open FocusForge</a><p class="hint">If the button does not open the app, open FocusForge from your Home Screen and sign in.</p></div></section><footer><a href="/support/">Support</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a></footer></main><script type="module" src="./main.js"></script></body></html>
